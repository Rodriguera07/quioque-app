<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <title>Quiosque PDV</title>

    <!-- PWA (theme-color e favicon vêm de app.json > web, injetados automaticamente pelo Expo) -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="background-color" content="#F5ECD8" />

    <!-- iOS: permite abrir em tela cheia a partir da tela de início -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Quiosque PDV" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Outros navegadores com suporte a PWA (Android/Chrome) -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Evita que números (ex.: valores/telas de relatório) virem links de telefone no iOS -->
    <meta name="format-detection" content="telephone=no" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
        touch-action: manipulation;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      Você precisa habilitar o JavaScript para executar este aplicativo.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
